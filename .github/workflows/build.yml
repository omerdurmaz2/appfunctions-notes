name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # The Robolectric tests call the real AppFunctions through AppFunctionTestRule.
      # The instrumented test needs an API 36.1+ emulator, so CI only builds it.
      - run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lint
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
